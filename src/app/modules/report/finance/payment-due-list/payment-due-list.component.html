<div class="wlt-c-furg-content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12 col-sm-12 col-md-4 col-lg-4">
        <h1 class="mb-1">Report / Payment Due List</h1>
      </div>
      <div class="col-12 col-sm-12 col-md-8 col-lg-8 my-1">
        <ol class="breadcrumb float-md-right">
          <li class="breadcrumb-item"><a routerLink="/dashboard">Report</a></li>
          <li class="breadcrumb-item active">Payment Due List</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<mat-card class="report-card">
  <mat-card-content>

    <form [formGroup]="frm" (ngSubmit)="onSubmit()" *ngIf="warningMessage === ''">
      <div class="row">

        <!-- Branch -->
        <div class="col-12 col-sm-12 col-md-3 col-lg-3">
          <mat-form-field appearance="outline">
            <mat-label>Branch</mat-label>
            <mat-select formControlName="Branch" [panelClass]="'custom-dropdown-panel'">
              <mat-option value="0"></mat-option>
              <mat-option *ngFor="let d of branchList" value="{{d.Code}}">{{d.Code}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <!-- Supplier -->
        <div class="col-12 col-sm-12 col-md-3 col-lg-3">
          <mat-form-field appearance="outline">
            <mat-label>Supplier</mat-label>
            <mat-select formControlName="Supplier" [panelClass]="'custom-dropdown-panel'">
              <mat-option value="0"></mat-option>
              <mat-option *ngFor="let s of supplierList" value="{{s.Id}}">{{s.Name}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

      </div>

      <div class="row">

        <!-- Start Date -->
        <div class="col-12 col-sm-12 col-md-3 col-lg-3">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input type="text" formControlName="StartDate" matInput [matDatepicker]="picker1"
              placeholder="" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
            <mat-error *ngIf="frm.get('StartDate')?.hasError('required')">Start Date is required</mat-error>
          </mat-form-field>
        </div>

        <!-- End Date -->
        <div class="col-12 col-sm-12 col-md-3 col-lg-3">
          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input type="text" formControlName="EndDate" matInput [matDatepicker]="picker2"
              placeholder="" autocomplete="off">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
            <mat-error *ngIf="frm.get('EndDate')?.hasError('required')">End Date is required</mat-error>
          </mat-form-field>
        </div>

        <!-- Show Button -->
        <div class="col-12 col-sm-12 col-md-3 col-lg-3 d-flex align-items-center">
          <button type="submit" class="btn wlt-c-furg-btn-primary">Show</button>
        </div>

      </div>
    </form>

    <div *ngIf="warningMessage !== ''">
      <mat-label style="color:red" [innerHTML]="warningMessage"></mat-label>
    </div>
    <div *ngIf="errorMessage !== ''">
      <mat-label style="color:red" [innerHTML]="errorMessage"></mat-label>
    </div>

    <br />
    <iframe *ngIf="urlSafe" class="report-wrapper fixed-height" [src]="urlSafe"></iframe>

  </mat-card-content>
</mat-card>

<!-- Loading spinner -->
<div [style.display]="showLoadingSpinner ? 'block' : 'none'"
  style="margin-top: -10.5rem; display: block; margin-left: -6.5rem;">
  <div class="d-flex justify-content-center">
    <span class="loader"></span>
  </div>
</div>
